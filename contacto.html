<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Forma Digital</title>
    <meta name="description" content="Contáctanos para transformar tu marca.">

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: {
                        '13': '3.25rem',
                        '21': '5.25rem',
                        '34': '8.5rem',
                        '55': '13.75rem',
                        '89': '22.25rem',
                        '144': '36rem',
                        '233': '58.25rem',
                        '377': '94.25rem',
                    },
                    colors: {
                        bauhaus: {
                            red: '#D93025',
                            blue: '#1A73E8',
                            yellow: '#F9AB00',
                            black: '#111111',
                            white: '#F4F4F0',
                        }
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        display: ['Archivo', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800&family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bauhaus-red: #D93025;
            --bauhaus-blue: #1A73E8;
            --bauhaus-yellow: #F9AB00;
            --bauhaus-black: #111111;
            --bauhaus-white: #F4F4F0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bauhaus-white);
            color: var(--bauhaus-black);
            overflow-x: hidden;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #F4F4F0;
            border-left: 1px solid #111;
        }

        ::-webkit-scrollbar-thumb {
            background: #111;
            border: 2px solid #F4F4F0;
        }

        /* Bauhaus Utilities */
        .bauhaus-border {
            border: 2px solid #111111;
        }

        .bauhaus-shadow {
            box-shadow: 4px 4px 0px #111111;
        }

        .bauhaus-shadow-hover:hover {
            box-shadow: 6px 6px 0px #111111;
            transform: translate(-2px, -2px);
        }
    </style>
</head>

<body
    class="bg-bauhaus-white text-bauhaus-black antialiased selection:bg-bauhaus-yellow selection:text-bauhaus-black h-screen overflow-hidden flex items-center justify-center">

    <div class="container mx-auto px-6 h-full flex flex-col justify-center relative py-12">
        <!-- Close Button -->
        <a href="index.html"
            class="absolute top-8 right-6 z-50 text-bauhaus-black hover:text-bauhaus-red transition-colors">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </a>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-24 items-center max-w-6xl mx-auto w-full">
            <!-- Left Column: Form -->
            <div class="w-full">
                <h1 class="text-5xl md:text-7xl font-display font-black mb-8 leading-tight">
                    ¿TIENES UN<br>
                    <span class="text-bauhaus-blue underline decoration-4 underline-offset-8">PROYECTO?</span>
                </h1>
                <div class="bg-white p-8 border-2 border-bauhaus-black bauhaus-shadow">
                    <form action="https://formspree.io/f/manlpzyq" method="POST" class="space-y-4">
                        <div>
                            <label class="block text-sm font-black text-bauhaus-black mb-2 uppercase">Nombre</label>
                            <input type="text" name="name"
                                class="w-full bg-gray-100 border-2 border-bauhaus-black px-4 py-3 text-bauhaus-black focus:bg-white focus:outline-none focus:border-bauhaus-blue transition-colors font-bold"
                                placeholder="TU NOMBRE" required>
                        </div>
                        <div>
                            <label class="block text-sm font-black text-bauhaus-black mb-2 uppercase">Email</label>
                            <input type="email" name="email"
                                class="w-full bg-gray-100 border-2 border-bauhaus-black px-4 py-3 text-bauhaus-black focus:bg-white focus:outline-none focus:border-bauhaus-blue transition-colors font-bold"
                                placeholder="TU@EMAIL.COM" required>
                        </div>
                        <div>
                            <label class="block text-sm font-black text-bauhaus-black mb-2 uppercase">Mensaje</label>
                            <textarea name="message" rows="4"
                                class="w-full bg-gray-100 border-2 border-bauhaus-black px-4 py-3 text-bauhaus-black focus:bg-white focus:outline-none focus:border-bauhaus-blue transition-colors font-bold"
                                placeholder="CUÉNTANOS SOBRE TU PROYECTO..." required></textarea>
                        </div>
                        <button type="submit"
                            class="w-full py-4 bg-bauhaus-red text-white font-black uppercase tracking-widest border-2 border-bauhaus-black hover:bg-bauhaus-blue transition-colors">
                            ENVIAR MENSAJE
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Contact Info -->
            <div class="flex flex-col gap-12">
                <div>
                    <h3
                        class="text-bauhaus-yellow font-black mb-6 uppercase tracking-widest text-xl bg-bauhaus-black text-white inline-block px-2">
                        CONTACTO DIRECTO</h3>
                    <a href="mailto:forma.digital.ar@gmail.com"
                        class="block text-2xl md:text-3xl hover:text-bauhaus-red transition-colors mb-4 font-display font-bold">forma.digital.ar@gmail.com</a>
                    <a href="https://wa.me/5491130666060" target="_blank"
                        class="block text-2xl md:text-3xl hover:text-bauhaus-red transition-colors font-display font-bold">+54
                        9 11 3066-6060</a>
                </div>

                <div>
                    <h3
                        class="text-bauhaus-yellow font-black mb-6 uppercase tracking-widest text-xl bg-bauhaus-black text-white inline-block px-2">
                        UBICACIÓN</h3>
                    <p class="text-bauhaus-black text-xl font-bold">Buenos Aires, Argentina</p>
                </div>

                <div>
                    <h3
                        class="text-bauhaus-yellow font-black mb-6 uppercase tracking-widest text-xl bg-bauhaus-black text-white inline-block px-2">
                        SÍGUENOS</h3>
                    <div class="flex gap-4">
                        <a href="https://www.instagram.com/forma.digital.ar/" target="_blank"
                            class="w-14 h-14 bg-white border-2 border-bauhaus-black flex items-center justify-center hover:bg-bauhaus-yellow transition-all duration-300 bauhaus-shadow-hover">
                            <span class="sr-only">Instagram</span>
                            <span class="font-black text-xl">IG</span>
                        </a>
                        <a href="https://www.linkedin.com/company/forma-digital" target="_blank"
                            class="w-14 h-14 bg-white border-2 border-bauhaus-black flex items-center justify-center hover:bg-bauhaus-blue transition-all duration-300 bauhaus-shadow-hover">
                            <span class="sr-only">LinkedIn</span>
                            <span class="font-black text-xl">LI</span>
                        </a>
                        <a href="https://www.facebook.com/formadigital" target="_blank"
                            class="w-14 h-14 bg-white border-2 border-bauhaus-black flex items-center justify-center hover:bg-bauhaus-red transition-all duration-300 bauhaus-shadow-hover">
                            <span class="sr-only">Facebook</span>
                            <span class="font-black text-xl">FB</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="src/translations.js"></script>
</body>

</html>
